[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfarm"
version = "0.4.0"
description = "Research-instrumented local-first short-form clipping pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zafar Suliman"}]
dependencies = [
  "yt-dlp>=2026.1.1",
  "faster-whisper>=1.1.1",
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13.9",
]

[project.optional-dependencies]
render = ["opencv-python>=4.10"]
analysis = ["opencv-python>=4.10"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
clipfarm = "clipfarm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
